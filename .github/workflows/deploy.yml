name: Deploy Sarf Mastery to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Cancel the stuck Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const staleSha = 'c8785da9366a282861fba115cfc8ba5b216c6991';
            const { owner, repo } = context.repo;
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                owner,
                repo,
                pages_deployment_id: staleSha,
              });
              core.info(`Cancelled stuck Pages deployment for ${staleSha}.`);
            } catch (error) {
              if (error.status === 404) {
                core.info('The stuck Pages deployment is already cleared.');
              } else {
                throw error;
              }
            }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
