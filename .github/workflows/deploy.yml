name: Deploy Sarf Mastery to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Clear the interrupted Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const staleSha = 'c8785da9366a282861fba115cfc8ba5b216c6991';
            const { owner, repo } = context.repo;
            const { data: deployments } = await github.rest.repos.listDeployments({ owner, repo, per_page: 100 });
            core.info(`Found ${deployments.length} deployment records.`);
            for (const deployment of deployments) core.info(`Deployment ${deployment.id}: ${deployment.sha} (${deployment.environment})`);
            const stale = deployments.filter((deployment) => deployment.sha === staleSha);
            core.info(`Found ${stale.length} deployment record(s) for interrupted SHA ${staleSha}.`);
            for (const deployment of stale) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: deployment.id, per_page: 1 });
              core.info(`Latest status for deployment ${deployment.id}: ${statuses[0]?.state ?? 'none'}`);
              if (statuses[0]?.state !== 'inactive') {
                await github.rest.repos.createDeploymentStatus({ owner, repo, deployment_id: deployment.id, state: 'inactive', description: 'Superseded after an interrupted Pages publish.' });
                core.info(`Marked interrupted Pages deployment ${deployment.id} inactive.`);
              }
            }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
